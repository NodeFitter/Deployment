# Persisten volume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: manual
  hostPath:
    path: /tmp/k8s-mariadb
---
# MariaDB service
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: backend
  labels:
    type: backend
spec:
  selector:
    type: backend
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
    - name: metrics
      port: 9104
      targetPort: 9104
  type: ClusterIP
---
# MariaDB StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: backend
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        type: backend
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_DATABASE
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_PASSWORD
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MARIADB_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - healthcheck.sh
                - --connect
                - --innodb_initialized
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
        - name: mysql-metrics
          image: prom/mysqld-exporter:0.20.0
          ports:
            - containerPort: 9104
          volumeMounts:
            - name: mysql-exporter-config
              mountPath: /.my.cnf
              subPath: .my.cnf
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: mariadb-initdb
        - name: mysql-exporter-config
          secret:
            secretName: mysql-exporter-secret
            items:
              - key: .my.cnf
                path: .my.cnf
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: manual
        resources:
          requests:
            storage: 1Gi
---
# TODO: adjust to recover MariaDB metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-backend
  namespace: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: mariadb # Must match with deploy name
  minReplicas: 1
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # Delay before apply change
      policies:
        - type: Percent
          value: 100 # Can scale until 100% of what already present in 60 seconds
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Pods
      pods:
        metric:
          name: mysql_reads_per_second
        target:
          type: AverageValue
          averageValue: "5"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "backend-network-policy"
  namespace: backend # Apply the network policy on namespace backend
spec:
  podSelector:
    matchLabels:
      type: backend # Apply the network policy to pods having label type=backend (and, because of namespace metadata, in namespace backend)
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: # Limit communication from only pods that are in namespace frontend and that also have label type=frontend and only if they are to port 80
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: frontend
        podSelector:
          matchLabels:
            type: frontend
      ports:
        - port: 3306
    - from: # Allow also traffic for monitoring
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9104 # TODO: adjust network policy to allow prometheus metrics retrieval
    - from: # Allow connection from other pods in backend namespace with label type=backend
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: backend
        podSelector:
          matchLabels:
            type: backend # TODO: remove backend<->backend rule if not necessary
  egress:
    - to: # Allow connection to other pods in backend namespace with label type=backend
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: backend
        podSelector:
          matchLabels:
            type: backend # TODO: remove backend<->backend rule if not necessary
    - to: # Allow DNS
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-servicemonitor-backend
  namespace: monitoring
  labels:
    monitoring: prometheus
spec:
  namespaceSelector:
    matchNames:
      - backend
  selector:
    matchLabels:
      type: backend
  endpoints:
    - port: metrics #must match Service port name
      path: /metrics
      interval: 15s